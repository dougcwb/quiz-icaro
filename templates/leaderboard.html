<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hall da Fama</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { font-size: 56px; color: #f8db00; text-shadow: 3px 3px 0 #ff5722; margin-bottom: 30px; letter-spacing: 4px; }
        .leaderboard-container { background: #111; padding: 20px; border: 4px solid #00e5ff; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
        .row { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 2px dashed #333; font-size: 28px; }
        .row.header { color: #00e5ff; font-weight: bold; border-bottom: 4px solid #555; font-size: 32px; }
        .row:nth-child(2) { color: #f8db00; font-size: 34px; text-shadow: 1px 1px 0 #000; } /* 1º Lugar */
        .row:nth-child(3) { color: #c0c0c0; } /* 2º Lugar */
        .row:nth-child(4) { color: #cd7f32; } /* 3º Lugar */
        .name { flex: 2; text-align: left; }
        .score, .mastered { flex: 1; text-align: right; }
        
        .btn-end { display: inline-block; padding: 15px 30px; background: #333; color: #fff; text-decoration: none; border: 2px solid #fff; cursor: pointer; font-size: 28px; border-radius: 8px; margin-top: 30px; }
        .btn-xbox { display: inline-block; width: 32px; height: 32px; line-height: 34px; text-align: center; border-radius: 50%; font-family: sans-serif; font-weight: bold; color: #111; border: 2px solid #111; margin-right: 15px; font-size: 18px; box-shadow: 2px 2px 0 #000; background-color: #dc3545; color: #fff; border-color: #fff;}
    </style>
</head>
<body>
    <h1>🏆 HALL DA FAMA 🏆</h1>
    
    <div class="leaderboard-container">
        <div class="row header">
            <div class="name">JOGADOR</div>
            <div class="score">⭐ PONTOS</div>
            <div class="mastered">🎓 MASTER</div>
        </div>
        
        {% for player in ranking %}
        <div class="row">
            <div class="name">{{ loop.index }}. {{ player[0] }}</div>
            <div class="score">{{ player[1] }}</div>
            <div class="mastered">{{ player[2] }}</div>
        </div>
        {% endfor %}
    </div>

    <div class="btn-end" onclick="window.location.href='/'">
        <span class="btn-xbox">B</span> VOLTAR AO MENU
    </div>

    <script>
        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'b' || e.key === '2' || e.key === 'Escape') window.location.href = '/';
        });

        let lastButtonState = [];
        function updateGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if(gamepads[0]) {
                const gp = gamepads[0];
                if(gp.buttons[1].pressed && !lastButtonState[1]) {
                    window.location.href = '/'; 
                }
                lastButtonState[1] = gp.buttons[1].pressed;
            }
            requestAnimationFrame(updateGamepad);
        }
        updateGamepad();
    </script>
</body>
</html>
