<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quiz Retrô</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: #fff; text-align: center; padding: 20px; font-size: 24px; line-height: 1.2; }
        #game-container { max-width: 800px; margin: 0 auto; background: #111; padding: 20px; border: 4px solid #fff; border-radius: 8px; box-shadow: inset 0 0 10px #555; }
        #question-box { margin-bottom: 30px; font-size: 32px; color: #f8db00; min-height: 80px; }
        .option { display: flex; align-items: center; margin: 15px auto; padding: 15px; background: #222; border: 2px solid #555; cursor: pointer; text-align: left; transition: 0.2s; font-size: 26px; }
        .option.correct { background: #1a4d2e; border-color: #28a745; color: #fff; }
        .option.wrong { background: #4a151b; border-color: #dc3545; opacity: 0.5; pointer-events: none; }
        #feedback { font-size: 24px; color: #ff5722; margin-top: 20px; min-height: 30px; }
        #score-board { margin-bottom: 20px; font-size: 24px; color: #00e5ff; display: flex; justify-content: space-between; border-bottom: 2px dashed #555; padding-bottom: 10px; }
        
        .btn-end { display: inline-block; padding: 15px 30px; margin: 20px 10px; background: #333; color: #fff; text-decoration: none; border: 2px solid #fff; cursor: pointer; font-size: 24px; border-radius: 8px;}
        .highlight { color: #f8db00; font-size: 36px; }
        
        .btn-xbox { display: inline-block; width: auto; min-width: 32px; padding: 0 8px; height: 32px; line-height: 34px; text-align: center; border-radius: 16px; font-family: sans-serif; font-weight: bold; color: #111; border: 2px solid #111; margin-right: 15px; font-size: 18px; box-shadow: 2px 2px 0 #000; }
        .btn-a { background-color: #28a745; } .btn-b { background-color: #dc3545; color: #fff; border-color: #fff; } .btn-x { background-color: #007bff; color: #fff; border-color: #fff; } .btn-y { background-color: #ffc107; } 
        .score-line { font-size: 28px; margin: 20px 0; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <span>⭐ Recorde: <span id="highscore">0</span></span>
            <span>🔥 Combo: <span id="combo">0</span>x</span>
            <span>⭐ Pontos: <span id="stars">0</span></span>
            <span>Q: <span id="q-counter">1/10</span></span>
        </div>
        <div id="question-box">Iniciando...</div>
        <div id="options-box"></div>
        <div id="feedback"></div>
    </div>

    <script>
        const quizId = "{{ quiz_id }}";
        let perguntasSorteadas = [], currentQuestion = 0, stars = 0, combo = 0, acertos = 0, errosTotal = 0, errorsInCurrent = 0;
        let waitingNext = false, isGameOver = false, highScore = 0, masteredQuestions = [];

        fetch('/api/score/' + quizId).then(r => r.json()).then(data => { 
            highScore = data.highscore || 0; 
            document.getElementById('highscore').innerText = highScore; 
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'correct') { osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
            else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
        }

        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

        fetch('/api/quiz/' + quizId).then(r => r.json()).then(data => { 
            let p = data.perguntas.map((q, idx) => ({ ...q, original_idx: idx }));
            perguntasSorteadas = shuffle(p).slice(0, 10);
            perguntasSorteadas = perguntasSorteadas.map(q => {
                let alt = q.alternativas.map((texto, i) => ({ texto, isCorrect: i === q.resposta_correta }));
                return { ...q, alternativas: shuffle(alt) };
            });
            loadQuestion(); 
        });

        function loadQuestion() {
            if(currentQuestion >= perguntasSorteadas.length) { endGame(); return; }
            errorsInCurrent = 0; waitingNext = false;
            document.getElementById('feedback').innerText = '';
            document.getElementById('q-counter').innerText = `${currentQuestion + 1}/${perguntasSorteadas.length}`;
            
            const q = perguntasSorteadas[currentQuestion];
            document.getElementById('question-box').innerText = q.texto;
            
            const btnClasses = ['btn-a', 'btn-b', 'btn-x', 'btn-y'];
            const btnLetters = ['A | ✖', 'B | ⭕', 'X | 🟦', 'Y | 🔺'];
            
            let html = '';
            q.alternativas.forEach((alt, index) => {
                html += `<div class="option" id="opt-${index}" onclick="checkAnswer(${index}, ${alt.isCorrect})">
                            <span class="btn-xbox ${btnClasses[index]}">${btnLetters[index]}</span>
                            <span>${alt.texto}</span>
                         </div>`;
            });
            document.getElementById('options-box').innerHTML = html;
        }

        function checkAnswer(index, isCorrect) {
            if(waitingNext || isGameOver) { if(waitingNext) loadQuestion(); return; }
            const optEl = document.getElementById(`opt-${index}`);
            if(optEl.classList.contains('wrong')) return;

            if(isCorrect) {
                playSound('correct'); optEl.classList.add('correct');
                if(errorsInCurrent === 0) { stars += 3; acertos++; combo++; masteredQuestions.push(perguntasSorteadas[currentQuestion].original_idx); } 
                else if(errorsInCurrent === 1) { stars += 1; acertos++; combo = 0; }
                document.getElementById('stars').innerText = stars; document.getElementById('combo').innerText = combo;
                document.getElementById('feedback').innerText = "Certo! Pressione qualquer botão p/ avançar.";
                waitingNext = true; currentQuestion++;
            } else {
                playSound('wrong'); optEl.classList.add('wrong');
                errorsInCurrent++; errosTotal++; combo = 0; document.getElementById('combo').innerText = combo;
                if(errorsInCurrent >= 2) { document.getElementById('feedback').innerText = "Errou 2 vezes! Pulando para a próxima..."; waitingNext = true; currentQuestion++; } 
                else { document.getElementById('feedback').innerText = perguntasSorteadas[currentQuestion].dica_erro || "Tente outra!"; }
            }
        }

        function endGame() {
            isGameOver = true; document.getElementById('q-counter').innerText = "FIM"; document.getElementById('question-box').innerHTML = "STATUS DA MISSÃO";
            let msg = ""; 
            if(stars > highScore) { highScore = stars; msg = "<br><span class='highlight'>NOVO RECORDE GLOBAL!</span><br>"; } else { msg = "<br>Fim de jogo. Tente bater seu recorde!<br>"; }

            fetch('/api/score/' + quizId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ score: stars, correct_ids: masteredQuestions }) });

            document.getElementById('options-box').innerHTML = `
                ${msg}
                <div class="score-line">✔️ Acertos: ${acertos} &nbsp;|&nbsp; ❌ Erros: ${errosTotal} &nbsp;|&nbsp; ⭐ Pontos: ${stars}</div>
                <div class="btn-end" onclick="location.reload()"><span class="btn-xbox btn-a">A | ✖</span> REFAZER</div>
                <div class="btn-end" onclick="window.location.href='/'"><span class="btn-xbox btn-b">B | ⭕</span> VOLTAR</div>
            `;
            document.getElementById('feedback').innerText = "";
        }

        window.addEventListener('keydown', (e) => {
            if(isGameOver) { if(e.key === '1' || e.key.toLowerCase() === 'a') location.reload(); if(e.key === '2' || e.key.toLowerCase() === 'b') window.location.href = '/'; return; }
            if(waitingNext) { loadQuestion(); return; }
            if(e.key === '1') document.getElementById('opt-0').click(); if(e.key === '2') document.getElementById('opt-1').click();
            if(e.key === '3') document.getElementById('opt-2').click(); if(e.key === '4') document.getElementById('opt-3').click();
        });

        let lastButtonState = [];
        function updateGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if(gamepads[0]) {
                const gp = gamepads[0];
                if(isGameOver) {
                    if(gp.buttons[0].pressed && !lastButtonState[0]) location.reload();
                    if(gp.buttons[1].pressed && !lastButtonState[1]) window.location.href = '/';
                } else {
                    for(let i=0; i<4; i++) {
                        if(gp.buttons[i].pressed && !lastButtonState[i]) {
                            if(waitingNext) loadQuestion(); else { const el = document.getElementById(`opt-${i}`); if(el) el.click(); }
                        }
                        lastButtonState[i] = gp.buttons[i].pressed;
                    }
                }
            }
            requestAnimationFrame(updateGamepad);
        }
        updateGamepad();
    </script>
</body>
</html>
