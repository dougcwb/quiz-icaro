version: '3'
services:
  quiz-app:
    build: .
    container_name: quiz_icaro
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_COMMIT: ${APP_COMMIT:-}
    ports:
      - "8090:5000"
    volumes:
      - ./quizzes:/app/quizzes
      - ./templates:/app/templates
      - ./static:/app/static
